[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "netblame"
version = "0.1.0"
description = "Ping every hop of your network path in parallel and find out which segment is to blame for packet loss and latency."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Jorrit" }]
keywords = ["network", "ping", "packet loss", "latency", "troubleshooting"]
classifiers = [
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
netblame = "netblame.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
